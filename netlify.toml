[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["index.html", "riskdesk.html"]

[functions."weekly-signal-automation"]
  schedule = "30 22 * * *"

[[redirects]]
  from = "/api/quotes"
  to = "/.netlify/functions/quotes"
  status = 200

[[redirects]]
  from = "/api/stocks"
  to = "/.netlify/functions/stocks"
  status = 200

[[redirects]]
  from = "/api/universe"
  to = "/.netlify/functions/universe"
  status = 200

[[redirects]]
  from = "/api/backtest"
  to = "/.netlify/functions/backtest"
  status = 200

[[redirects]]
  from = "/api/ledger"
  to = "/.netlify/functions/ledger"
  status = 200

[[redirects]]
  from = "/api/run-weekly-automation"
  to = "/.netlify/functions/run-weekly-automation"
  status = 200

[[redirects]]
  from = "/api/automation-status"
  to = "/.netlify/functions/automation-status"
  status = 200

[[redirects]]
  from = "/api/eodhd-history"
  to = "/.netlify/functions/eodhd-history"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
