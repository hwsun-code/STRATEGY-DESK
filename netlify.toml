[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/quotes"
  to = "/.netlify/functions/quotes"
  status = 200

[[redirects]]
  from = "/api/ledger"
  to = "/.netlify/functions/ledger"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
