[build]
  publish = "outputs"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["outputs/index.html"]

[[redirects]]
  from = "/api/quotes"
  to = "/.netlify/functions/quotes"
  status = 200

[[redirects]]
  from = "/api/stocks"
  to = "/.netlify/functions/stocks"
  status = 200

[[redirects]]
  from = "/api/universe"
  to = "/.netlify/functions/universe"
  status = 200

[[redirects]]
  from = "/api/backtest"
  to = "/.netlify/functions/backtest"
  status = 200

[[redirects]]
  from = "/api/ledger"
  to = "/.netlify/functions/ledger"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
